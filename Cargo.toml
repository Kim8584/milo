[package]
name = "milo"
version = "0.1.0"
edition = "2021"
description = "Proof-to-Move compiler for turning Circom/snarkjs Groth16 verification keys into gas-optimized Aptos Move verifiers"
license = "Apache-2.0"

[dependencies]
ark-bn254 = "0.4.0"
ark-ec = "0.4.0"
ark-ff = "0.4.0"
ark-serialize = "0.4.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
num-bigint = "0.4"
num-traits = "0.2"
hex = "0.4"
anyhow = "1.0"
clap = { version = "4.4", features = ["derive"] }
