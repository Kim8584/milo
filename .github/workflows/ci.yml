name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-rust:
    name: Build & Test CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build CLI (Release)
        run: cargo build --release

      - name: Run Integration Tests
        run: cargo test

      - name: Verify Circuit Fixtures
        run: |
          ./target/release/milo verify \
            --vk examples/circuits/multiplier2_vk.json \
            --proof examples/circuits/multiplier2_proof.json \
            --public examples/circuits/multiplier2_public.json
          ./target/release/milo verify \
            --vk examples/circuits/poly4_vk.json \
            --proof examples/circuits/poly4_proof.json \
            --public examples/circuits/poly4_public.json
